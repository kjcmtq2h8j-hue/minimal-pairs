name: Build Standalone App

on:
  workflow_dispatch:  # Manual trigger — click "Run workflow" in GitHub Actions

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: MinimalPairs-mac
          - os: windows-latest
            artifact: MinimalPairs-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install flask pyinstaller

      - name: Build app
        run: python build_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/MinimalPairs*
